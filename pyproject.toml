[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "healthvibe"
version = "0.1.0"
description = "Self-hosted, privacy-first, multi-user Apple Health dashboard"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Toby Moon" }]
keywords = ["apple-health", "fastapi", "self-hosted"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "alembic>=1.14",
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
healthvibe = "healthvibe.main:main"

[project.urls]
Homepage = "https://github.com/mortbrew/healthvibe"

[tool.hatch.build.targets.wheel]
packages = ["healthvibe"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["healthvibe", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["healthvibe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
