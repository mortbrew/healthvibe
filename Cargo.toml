[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/mortbrew/healthvibe"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
argon2 = "0.5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
hex = "0.4"
quick-xml = "0.37"
rand = "0.8"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
healthvibe-core = { path = "crates/healthvibe-core" }
healthvibe-server = { path = "crates/healthvibe-server" }
healthvibe-themes = { path = "crates/healthvibe-themes" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
